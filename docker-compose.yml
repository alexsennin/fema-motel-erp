services:
  fema-local:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      PORT: "8787"
      FEMA_LOCAL_DOCKER: "1"
      FEMA_LOCAL_USER_EMAIL: "dev@example.test"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
