<!doctype html>
<html lang="es">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; background: #f4f7fb; color: #172033; }
      header { background: #1f4e78; color: white; padding: 18px 24px; }
      header h1 { margin: 0; font-size: 22px; }
      header p { margin: 5px 0 0; opacity: .8; }
      main { padding: 24px; }
      #rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
      .room { background: white; border-radius: 12px; box-shadow: 0 3px 12px rgba(19, 46, 76, .08); padding: 16px; border-left: 7px solid #9aa4b2; }
      .room h2 { margin: 0 0 4px; font-size: 21px; }
      .room p { margin: 4px 0; color: #536176; }
      .room[data-status="DISPONIBLE"] { border-color: #3d8b40; }
      .room[data-status="OCUPADA"] { border-color: #c62828; }
      .room[data-status="SUCIA"] { border-color: #f9a825; }
      .room[data-status="LIMPIEZA"] { border-color: #1565c0; }
      .room[data-status="MANTENIMIENTO"] { border-color: #424242; }
      .message { background: white; border-radius: 10px; padding: 18px; }
      .error { color: #b42318; border: 1px solid #fecdca; background: #fff6f5; }
    </style>
  </head>
  <body>
    <header>
      <h1>FEMA · Habitaciones</h1>
      <p id="session">Cargando sesión…</p>
    </header>
    <main>
      <div id="rooms"><div class="message">Cargando habitaciones…</div></div>
    </main>
    <script>
      const rooms = document.getElementById("rooms");
      const session = document.getElementById("session");

      const escapeHtml = (value) => String(value).replace(/[&<>'"]/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#039;", '"': "&quot;"
      })[character]);

      const render = (response) => {
        if (!response.ok) {
          rooms.innerHTML = `<div class="message error">${escapeHtml(response.error.message)}</div>`;
          session.textContent = "Acceso no disponible";
          return;
        }
        session.textContent = `${response.data.user.name} · ${response.data.generatedAt}`;
        if (!response.data.rooms.length) {
          rooms.innerHTML = '<div class="message">No hay habitaciones configuradas para este motel.</div>';
          return;
        }
        rooms.innerHTML = response.data.rooms.map((room) => `
          <article class="room" data-status="${escapeHtml(room.estado)}">
            <h2>Habitación ${escapeHtml(room.numeroHabitacion)}</h2>
            <p>${escapeHtml(room.tipoHabitacion)}</p>
            <strong>${escapeHtml(room.estado)}</strong>
            <p>Desde $${Number(room.precioDesde).toLocaleString("es-MX")}</p>
          </article>
        `).join("");
      };

      google.script.run
        .withSuccessHandler(render)
        .withFailureHandler((error) => render({ ok: false, error: { message: error.message || String(error) } }))
        .apiGetInitialState();
    </script>
  </body>
</html>
